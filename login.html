<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar Sesión</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-size: cover;
        background-position: center;
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDa4Xu0QUi1_Tx8nWP0IU9nXlTD_Lx7bdXIg&s');
    }

    .contenedor {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(2px);
    }

    .card {
        background: white;
        width: 330px;
        padding: 30px 25px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #7d1bbd;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #9b22d6;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #b84af0;
    }

    a {
        display: block;
        margin-top: 15px;
        text-decoration: none;
        color: #7d1bbd;
        font-weight: bold;
    }

</style>
</head>

<body>

<div class="contenedor">
    <div class="card">
        <h2>Iniciar Sesión</h2>

        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Correo" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>

        <a href="registro.html">Crear cuenta nueva</a>
    </div>
</div>

</body>
</html>
